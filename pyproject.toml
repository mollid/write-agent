[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["novel"]

[project]
name = "novel"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2",
  "pydantic>=2.6",
  "litellm>=1.40",
  "chromadb>=0.5",
  "typer>=0.12",
  "tenacity>=8.2",
  "pyyaml>=6.0",
  "rich>=13.7",
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.52.2",
  "edge-tts>=7.2",
]

[project.scripts]
novel = "novel.cli:app"
novel-ui = "novel.ui:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_generics = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
