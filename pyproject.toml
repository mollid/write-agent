[project]
name = "novel"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2",
  "pydantic>=2.6",
  "litellm>=1.40",
  "chromadb>=0.5",
  "typer>=0.12",
  "tenacity>=8.2",
  "pyyaml>=6.0",
  "rich>=13.7",
]

[project.scripts]
novel = "novel.cli:app"

[tool.uv]
dev-dependencies = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
disallow_any_generics = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
